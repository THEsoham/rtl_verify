[project]
name = "rtl-verify"
version = "0.1.0"
description = "LLM-Driven RTL Design and Verification Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "nicegui>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # LLM client
    "httpx>=0.27",
    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # Configuration
    "pydantic-settings>=2.0",
    "pydantic>=2.0",
    # Templating
    "jinja2>=3.1",
    # Data handling
    "pyyaml>=6.0",
    # Utilities
    "rich>=13.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
finetune = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.12",
    "datasets>=2.20",
    "accelerate>=0.30",
]

[project.scripts]
rtl-verify = "rtl_verify.web.app:main"
rtl-benchmark = "scripts.run_benchmark:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
