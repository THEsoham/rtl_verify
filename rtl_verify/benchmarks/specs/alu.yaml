name: "alu"
category: "combinational"
difficulty: "easy"
description: |
  4-bit Arithmetic Logic Unit (ALU) performing arithmetic, logical, and shift operations
  selected by a 3-bit opcode. Operates combinatorially on two 4-bit inputs `a` and `b`,
  producing an 8-bit output `result`, a `zero` flag, and a `carry` flag.

  Supported Operations (selected by `opcode`):
  - 3'b000 (ADD): result = a + b (carry indicates 4-bit addition overflow)
  - 3'b001 (SUB): result = a - b (carry indicates borrow / underflow)
  - 3'b010 (AND): result = a & b (carry = 0)
  - 3'b011 (OR):  result = a | b (carry = 0)
  - 3'b100 (XOR): result = a ^ b (carry = 0)
  - 3'b101 (NOT): result = ~a (bitwise NOT of operand a, carry = 0)
  - 3'b110 (SHL): result = a << 1 (logical left shift by 1, carry = shifted-out MSB a[3])
  - 3'b111 (SHR): result = a >> 1 (logical right shift by 1, carry = shifted-out LSB a[0])
ports:
  inputs:
    - name: "a"
      width: 4
      description: "4-bit operand A"
    - name: "b"
      width: 4
      description: "4-bit operand B"
    - name: "opcode"
      width: 3
      description: "3-bit operation code selector (000:ADD, 001:SUB, 010:AND, 011:OR, 100:XOR, 101:NOT, 110:SHL, 111:SHR)"
  outputs:
    - name: "result"
      width: 8
      description: "8-bit computation result (upper bits zero-extended for 4-bit results)"
    - name: "zero"
      width: 1
      description: "Active-high flag asserted when result == 8'b00000000"
    - name: "carry"
      width: 1
      description: "Carry flag: overflow on ADD, borrow on SUB, shifted-out bit on SHL/SHR, 0 for logic ops"
requirements:
  - "Module name must be `alu`."
  - "Design must be purely combinational logic without internal registers, clock, or reset."
  - "Implement all 8 specified operations accurately according to the 3-bit opcode."
  - "The 8-bit `result` must zero-extend 4-bit results on logical, arithmetic, and shift operations."
  - "The `zero` flag must be 1'b1 if and only if `result` == 8'h00; otherwise it must be 1'b0."
  - "The `carry` flag must be set to 1'b1 on ADD when a + b > 15 (arithmetic overflow)."
  - "The `carry` flag must be set to 1'b1 on SUB when a < b (arithmetic borrow / underflow)."
  - "The `carry` flag for SHL must be the bit shifted out from the MSB (a[3])."
  - "The `carry` flag for SHR must be the bit shifted out from the LSB (a[0])."
  - "The `carry` flag must be 1'b0 for bitwise logic operations (AND, OR, XOR, NOT)."
verification_hints:
  - "Verify all 8 operations across edge-case input combinations (0x0, 0xF, 0x5, 0xA)."
  - "Test ADD overflow boundary conditions: e.g., 0xF + 0x1 = 0x10 (carry=1, result=0x00, zero=1)."
  - "Test SUB underflow boundary conditions: e.g., 0x0 - 0x1 (carry=1, result=0xFF or two's complement equivalent)."
  - "Test SUB equal operands: e.g., 0xA - 0xA = 0x0 (carry=0, result=0x00, zero=1)."
  - "Test bitwise NOT against 0x0 (should yield result 0x0F, zero=0) and against 0xF (should yield result 0x00, zero=1)."
  - "Test SHL shift behavior with MSB=1 (0b1000 -> carry=1, result=0x00) and MSB=0 (0b0100 -> carry=0, result=0x08)."
  - "Test SHR shift behavior with LSB=1 (0b0001 -> carry=1, result=0x00) and LSB=0 (0b0010 -> carry=0, result=0x01)."
  - "Verify zero flag is strictly asserted only when result is zero and deasserted otherwise across all ops."
